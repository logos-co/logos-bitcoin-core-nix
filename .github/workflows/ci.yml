name: CI

# libbitcoind_c, whose build checks its export list, then `nix flake check`: the C harness
# offline (three regtest cycles, a regtest -> signet -> regtest switch, -server=1 cycles, stops
# with connects in flight). Then Windows: the cross build, the same harness under wine and on
# windows-latest.

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: nix (${{ matrix.os }})
    # ATTIC_TOKEN_PUBLIC only exists in the public-cache environment.
    environment: ${{ github.ref == 'refs/heads/master' && 'public-cache' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix and set up the shared cache
        uses: logos-co/setup-nix-cache-action@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}

      - name: Build libbitcoind_c
        # The build itself checks the export list (ci/check-exports.sh; objdump on Windows).
        run: nix build -L .#default

      - name: Patch guard and the harness
        run: nix flake check -L

  windows:
    # The cross build on Linux, the PE and import-closure gates and the hand-off live in
    # logos-co/logos-windows-ci. The harness runs under wine, then on windows-latest.
    uses: logos-co/logos-windows-ci/.github/workflows/windows-ci.yml@v1
    secrets: inherit
    with:
      targets: bitcoind-c-test
      # libbitcoind_c.dll beside it: LoadLibrary looks in the executable's directory first.
      smoke: |
        run bitcoind-c-test/bin/bitcoind-c-test.exe "$STAGE_ABS/work"
      # Measured 5 derivations to build on a cold cache (2026-10-11), libbitcoind_c the long one.
      timeout-minutes: 120
